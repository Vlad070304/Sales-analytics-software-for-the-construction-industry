<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BuildSales Insight</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><div><span class="eyebrow">АНАЛІТИЧНА СИСТЕМА</span><h1>BuildSales Insight</h1><p>Продажі для будівельної галузі</p></div><button id="open-sale">+ Додати продаж</button></header>
  <main>
    <section class="kpis" id="kpis"></section>
    <section class="panel"><div class="panel-heading"><div><span class="eyebrow">ДИНАМІКА</span><h2>Виручка за місяцями</h2></div><span class="badge">UAH</span></div><div id="chart" class="chart"></div></section>
    <section class="split"><div class="panel"><div class="panel-heading"><div><span class="eyebrow">SRI</span><h2>Ризик дефіциту</h2></div></div><div id="risk-list"></div></div><div class="panel"><div class="panel-heading"><div><span class="eyebrow">РЕЙТИНГ</span><h2>Менеджери продажів</h2></div></div><div id="manager-list"></div></div></section>
    <section class="panel"><div class="panel-heading"><div><span class="eyebrow">ПРОГНОЗ</span><h2>Планування попиту</h2></div><span class="hint">3 місяці вперед</span></div><div class="table-wrap"><table><thead><tr><th>Матеріал</th><th>Запас</th><th>Ризик</th><th>Прогнозований попит</th></tr></thead><tbody id="forecast-list"></tbody></table></div></section>
  </main>
  <dialog id="sale-dialog"><form id="sale-form" method="dialog"><div class="modal-title"><h2>Новий продаж</h2><button type="button" class="close" id="close-sale">×</button></div><label>Дата<input name="sold_at" type="date" required></label><label>Матеріал<select name="material_id" id="material-select" required></select></label><label>Менеджер<input name="manager" placeholder="Ім'я та прізвище" required></label><label>Клієнт<input name="customer" required></label><div class="form-row"><label>Кількість<input name="quantity" type="number" min="0.01" step="0.01" required></label><label>Ціна за одиницю, ₴<input name="unit_price" type="number" min="0" step="0.01" required></label></div><p id="form-error" class="error"></p><button class="submit" type="submit">Зберегти продаж</button></form></dialog>
  <script src="/app.js"></script>
</body></html>
